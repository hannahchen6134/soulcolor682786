<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560">
  <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="4" seed="17" stitchTiles="stitch" result="fine"/>
    <feTurbulence type="fractalNoise" baseFrequency=".13 .085" numOctaves="2" seed="29" stitchTiles="stitch" result="fiber"/>
    <feComponentTransfer in="fiber" result="fiberSoft">
      <feFuncR type="linear" slope=".44" intercept=".28"/>
      <feFuncG type="linear" slope=".44" intercept=".28"/>
      <feFuncB type="linear" slope=".44" intercept=".28"/>
    </feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency=".022 .031" numOctaves="3" seed="41" stitchTiles="stitch" result="cloud"/>
    <feComponentTransfer in="cloud" result="cloudSoft">
      <feFuncR type="linear" slope=".27" intercept=".365"/>
      <feFuncG type="linear" slope=".27" intercept=".365"/>
      <feFuncB type="linear" slope=".27" intercept=".365"/>
    </feComponentTransfer>
    <feBlend in="fine" in2="fiberSoft" mode="soft-light" result="fibrous"/>
    <feBlend in="fibrous" in2="cloudSoft" mode="soft-light" result="texture"/>
    <feColorMatrix in="texture" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope=".78" intercept=".11"/>
      <feFuncG type="linear" slope=".74" intercept=".13"/>
      <feFuncB type="linear" slope=".68" intercept=".17"/>
    </feComponentTransfer>
  </filter>
  <rect width="560" height="560" fill="#f2e8dd" filter="url(#paper)"/>
</svg>
