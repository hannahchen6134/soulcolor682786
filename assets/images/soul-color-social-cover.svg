<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf5ed"/>
      <stop offset="1" stop-color="#f2e6db"/>
    </linearGradient>
    <radialGradient id="rose">
      <stop offset="0" stop-color="#d88e8c" stop-opacity=".24"/>
      <stop offset="1" stop-color="#d88e8c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sage">
      <stop offset="0" stop-color="#a7b6a3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#a7b6a3" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#58352e" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <ellipse cx="106" cy="110" rx="390" ry="300" fill="url(#rose)"/>
  <ellipse cx="1090" cy="575" rx="370" ry="290" fill="url(#sage)"/>
  <path d="M0 548 C240 590 410 570 590 630 H0Z" fill="#e9d4c8" opacity=".22"/>
  <g fill="#684039" font-family="'Noto Serif TC','Source Han Serif TC','PMingLiU',serif">
    <text x="78" y="112" font-family="Georgia,serif" font-size="17" letter-spacing="4" opacity=".72">SOUL COLOR · PERSON PALETTE</text>
    <text x="76" y="292" font-size="66" letter-spacing="5">人物調色盤</text>
    <text x="80" y="364" font-size="29" letter-spacing="2">選一個色彩，聊聊你的故事。</text>
    <text x="80" y="424" font-size="18" letter-spacing="1.5" opacity=".76">色彩 × 訪談・一種訪談，三種呈現</text>
  </g>
  <g filter="url(#soft-shadow)">
    <image href="../media/about-color-story-cards.png" x="585" y="178" width="590" height="265" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <text x="1118" y="572" text-anchor="end" fill="#76554c" font-family="Georgia,serif" font-size="13" letter-spacing="3" opacity=".7">COLOR OPENS A CONVERSATION</text>
</svg>
